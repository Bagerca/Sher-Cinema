<!-- index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sher Cinema - Streamer Dashboard</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23050508'/><text x='50' y='70' font-family='sans-serif' font-size='65' font-weight='bold' fill='%23ff2d95' text-anchor='middle'>S</text></svg>">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="cyber-bg"></div>

    <header class="cinema-header">
        <div class="brand">
            <h1>SHER <span>CINEMA</span></h1>
            <div class="status-badge"><span class="pulse-dot"></span> СИСТЕМА АКТИВНА</div>
        </div>
        
        <div class="playlist-selector-module" id="playlist-selector-module">
            <button class="source-btn active" id="active-playlist-btn">
                <i class="fas fa-folder-open"></i> <span id="active-playlist-name">ЗАГРУЗКА БАЗЫ...</span> <i class="fas fa-chevron-down" style="font-size: 0.7em; margin-left: 5px;"></i>
            </button>
            <div class="playlist-dropdown-menu" id="header-playlist-dropdown"></div>
        </div>
    </header>

    <main class="cinema-layout">
        
        <section class="player-section">
            <div class="video-container-wrapper" id="fullscreen-wrapper">
                <div class="video-frame" id="player-frame">
                    <div id="yt-player"></div>
                    <div class="video-shield"></div>
                    <div class="player-overlay-loader" id="player-loader">
                        <i class="fas fa-circle-notch fa-spin"></i> УСТАНОВКА СВЯЗИ...
                    </div>
                </div>
            </div>

            <div class="control-deck">
                <div class="custom-progress-area" id="progress-area">
                    <div class="custom-progress-fill" id="progress-fill"></div>
                </div>

                <div class="deck-content">
                    <div class="now-playing-info">
                        <a href="#" target="_blank" class="channel-avatar-link" id="channel-link" title="Перейти на канал">
                            <img src="data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27150%27%20height%3D%27150%27%3E%3Crect%20width%3D%27150%27%20height%3D%27150%27%20fill%3D%27%231a1a2e%27%2F%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2750%25%27%20font-family%3D%27sans-serif%27%20font-size%3D%2740%27%20fill%3D%27%2339ff14%27%20text-anchor%3D%27middle%27%20dy%3D%27.3em%27%3ECH%3C%2Ftext%3E%3C%2Fsvg%3E" alt="Channel" id="channel-avatar">
                        </a>
                        <div class="title-wrapper">
                            <!-- ОБНОВЛЕНО: Блок имени канала + статистика -->
                            <div class="channel-info-row">
                                <span class="channel-name" id="channel-name">SYSTEM STANDBY</span>
                                <span class="channel-meta" id="channel-meta"></span>
                            </div>
                            
                            <div class="title-scroller" id="title-scroller">
                                <a href="#" target="_blank" class="title" id="current-title" title="Смотреть на YouTube">Ожидание выбора протокола...</a>
                            </div>

                            <!-- НОВОЕ: Статистика видео -->
                            <div class="video-stats-row" id="video-stats-row"></div>
                        </div>
                    </div>
                    
                    <div class="playback-controls">
                        <button class="cyber-btn" id="btn-prev" title="Предыдущее"><i class="fas fa-step-backward"></i></button>
                        <button class="cyber-btn play-btn" id="btn-play" title="Старт/Пауза"><i class="fas fa-play"></i></button>
                        <button class="cyber-btn" id="btn-next" title="Следующее"><i class="fas fa-step-forward"></i></button>
                    </div>
                    
                    <div class="tools-controls">
                        <div class="time-display" id="time-display">0:00 / 0:00</div>
                        
                        <div class="deck-divider"></div>
                        
                        <button class="cyber-btn small-btn" id="btn-unlock" title="Снять защиту (Смена аудиодорожки)"><i class="fas fa-lock"></i></button>
                        <button class="cyber-btn small-btn" id="btn-cc" title="Субтитры"><i class="far fa-closed-captioning"></i></button>

                        <div class="volume-container">
                            <button class="cyber-btn small-btn" id="btn-mute" title="Вкл/Выкл звук"><i class="fas fa-volume-up"></i></button>
                            <input type="range" id="volume-slider" min="0" max="100" value="100" class="cyber-slider">
                        </div>

                        <div class="deck-divider"></div>

                        <div class="quality-badge" id="quality-badge">AUTO</div>

                        <div class="speed-module" id="speed-module">
                            <button class="cyber-btn small-btn speed-btn" id="btn-speed-toggle" title="Скорость">1.0x</button>
                            <div class="speed-dropdown" id="speed-dropdown">
                                <div class="s-header">СКОРОСТЬ</div>
                                <div class="s-option" data-speed="0.5">0.5x Медленно</div>
                                <div class="s-option active" data-speed="1">1.0x Обычная</div>
                                <div class="s-option" data-speed="1.25">1.25x Быстрее</div>
                                <div class="s-option" data-speed="1.5">1.5x Быстро</div>
                                <div class="s-option" data-speed="2">2.0x Экстрим</div>
                            </div>
                        </div>

                        <button class="cyber-btn small-btn" id="btn-fullscreen" title="На весь экран"><i class="fas fa-expand"></i></button>
                    </div>
                </div>
            </div>
        </section>

        <aside class="playlist-section">
            <div class="search-module" id="search-module">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-input" placeholder="Поиск по базе..." autocomplete="off">
                <button class="clear-btn" id="search-clear"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="playlist-header">
                <h3><i class="fas fa-list"></i> ДОСТУПНЫЕ ФАЙЛЫ</h3>
                <div class="header-tools">
                    <button class="sort-btn" id="btn-sort" title="Сортировка (А-Я / Я-А)"><i class="fas fa-sort-alpha-down"></i></button>
                    <span class="count" id="playlist-count">0</span>
                </div>
            </div>
            
            <div class="playlist-container" id="playlist-container"></div>
        </aside>

    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
